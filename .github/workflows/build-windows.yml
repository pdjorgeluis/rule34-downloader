# Builds the Windows zip of Rule34 Downloader on a real Windows runner.
# Run it by hand (Actions tab > Build Windows > Run workflow) or push a tag v*.
name: Build Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Create the build environment
        shell: pwsh
        run: |
          py -3.14 -m venv .venv
          .venv\Scripts\python.exe -m pip install -r requirements-build.txt

      - name: Run the tests (informational; some tests are Linux-only)
        continue-on-error: true
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: .venv\Scripts\python.exe -m unittest discover -s tests

      - name: Build, smoke-test and pack
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\build-windows.ps1

      - name: Upload the zip
        uses: actions/upload-artifact@v4
        with:
          name: rule34-downloader-windows
          path: build/rule34-downloader-*-windows-*.zip
          if-no-files-found: error

      - name: Upload the smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshot
          path: build/smoke.png
          if-no-files-found: ignore
